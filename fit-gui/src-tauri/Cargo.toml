[package]
name = "fit-gui"
version.workspace = true
edition.workspace = true

[lib]
name = "fit_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
fit-core.workspace = true
fit-format.workspace = true
fit-compression.workspace = true
fit-archive.workspace = true
fit-detection.workspace = true
fit-crypto.workspace = true
fit-recovery.workspace = true
fit-plugins.workspace = true
tauri = { version = "2.0", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.0", features = ["full"] }
