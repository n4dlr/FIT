name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies
        run: |
          cd fit-gui
          npm install

      - name: Build Tauri Desktop App & Bundles (.deb, .AppImage, .msi, .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './fit-gui'
          tagName: ${{ github.ref_name }}
          releaseName: 'FIT ${{ github.ref_name }}'
          releaseBody: 'FIT — Extreme Lossless Compression & Universal Archive Platform.'
          releaseDraft: false
          prerelease: false

  build-cli:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 dpkg-dev

      - name: Build Linux CLI & .deb
        run: |
          cargo build --release -p fit-cli
          mkdir -p /tmp/fit-deb/DEBIAN /tmp/fit-deb/usr/bin
          cp target/release/fit /tmp/fit-deb/usr/bin/fit
          cat << 'EOF' > /tmp/fit-deb/DEBIAN/control
          Package: fit-cli
          Version: 0.2.2
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Nadir <nadir@fit.arch>
          Description: FIT CLI — Extreme Lossless Compression Tool
          EOF
          dpkg-deb --build /tmp/fit-deb ./fit-cli-linux-amd64.deb

      - name: Build Windows CLI .exe
        run: |
          cargo build --release --target x86_64-pc-windows-gnu -p fit-cli
          cp target/x86_64-pc-windows-gnu/release/fit.exe ./fit-cli-windows-amd64.exe

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fit-cli-linux-amd64.deb
            fit-cli-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r25
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;25.2.9519653" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Install Rust Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: cd fit-gui && npm install

      - name: Initialize Tauri Android Project
        run: |
          cd fit-gui
          npx -y @tauri-apps/cli android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Build Android APK (release)
        run: |
          cd fit-gui
          npx -y @tauri-apps/cli android build --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Find & rename APK
        run: |
          APK=$(find fit-gui/src-tauri/gen/android -name "*.apk" | head -n 1)
          cp "$APK" ./FIT-${{ github.ref_name }}-android.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FIT-${{ github.ref_name }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

