[workspace]
resolver = "2"
members = [
    "fit-core",
    "fit-format",
    "fit-compression",
    "fit-archive",
    "fit-detection",
    "fit-crypto",
    "fit-recovery",
    "fit-plugins",
    "fit-cli",
    "fit-gui/src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["FIT Core Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fit-core = { path = "fit-core" }
fit-format = { path = "fit-format" }
fit-compression = { path = "fit-compression" }
fit-archive = { path = "fit-archive" }
fit-detection = { path = "fit-detection" }
fit-crypto = { path = "fit-crypto" }
fit-recovery = { path = "fit-recovery" }
fit-plugins = { path = "fit-plugins" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.10"
sha2 = "0.10"
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
reed-solomon-erasure = "6.0"
tar = "0.4"
flate2 = "1.0"
zip = "2.1"
zstd = "0.13"
xz2 = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
byteorder = "1.5"
hex = "0.4"
tempfile = "3.8"


